<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Local Music Player</title>
<style>
:root{--bg:#f3f1ee;--surface:#fff;--ink:#1b1d27;--mute:#6b6e7c;--line:#dedbd6;--accent:#2f4bd8;--accent-ink:#fff;--sel:#e8ebfb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14151c;--surface:#1d1f29;--ink:#eceef5;--mute:#8d91a3;--line:#2c2f3d;--accent:#8fa2ff;--accent-ink:#10122a;--sel:#262a40;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14151c;--surface:#1d1f29;--ink:#eceef5;--mute:#8d91a3;--line:#2c2f3d;--accent:#8fa2ff;--accent-ink:#10122a;--sel:#262a40;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif;min-height:100vh}
.app{max-width:640px;margin:0 auto;padding:16px 16px 28px;display:flex;flex-direction:column;gap:14px}
h1{font:600 22px/1.2 "Iowan Old Style",Georgia,serif;margin:4px 0 0}
.sub{color:var(--mute);font-size:14px;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,.track:focus-visible,.drop:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:18px;text-align:center;background:var(--surface);transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:var(--sel)}
.drop p{margin:0 0 12px;color:var(--mute);font-size:14px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{padding:10px 16px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.now{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.title{font:600 18px/1.25 "Iowan Old Style",Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{color:var(--mute);font-size:13px;margin-top:2px}
.seek{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
input[type=range]{flex:1;accent-color:var(--accent);height:28px;min-width:0}
.ctrl{display:flex;align-items:center;justify-content:space-between;gap:6px}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--mute)}
.ib.on{color:var(--accent)}
.ib svg{width:22px;height:22px;fill:currentColor}
.play{width:58px;height:58px;background:var(--accent);color:var(--accent-ink)}
.play svg{width:26px;height:26px}
.vol{display:flex;align-items:center;gap:8px;color:var(--mute)}
.vol svg{width:18px;height:18px;fill:currentColor;flex:none}
.vol input{max-width:140px}
.listhead{display:flex;align-items:center;gap:10px}
.listhead input{flex:1;min-width:0;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:15px}
.count{color:var(--mute);font-size:13px;white-space:nowrap}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.track{display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
.track:last-child{border-bottom:0}
.track[aria-current=true]{background:var(--sel)}
.track[aria-current=true] .tn{color:var(--accent);font-weight:600}
.tn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.td{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.empty{padding:22px 16px;text-align:center;color:var(--mute);font-size:14px}
.skip{color:var(--mute);font-size:12px;text-align:center;margin:0}
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>Local Music Player</h1>
    <p class="sub">Plays audio files from this device. Nothing is uploaded.</p>
  </header>

  <section class="drop" id="drop" tabindex="0" aria-label="Add music">
    <p>Drop audio files or a folder here, or choose them below.</p>
    <div class="row">
      <button class="btn" id="pickFiles">Choose files</button>
      <button class="btn alt" id="pickFolder">Choose folder</button>
    </div>
    <input type="file" id="files" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg,.opus" multiple hidden>
    <input type="file" id="folder" webkitdirectory multiple hidden>
  </section>
  <p class="skip" id="note" hidden></p>

  <section class="now" aria-label="Now playing">
    <div>
      <div class="title" id="title">Nothing playing</div>
      <div class="meta" id="meta">Add music to begin</div>
    </div>
    <div class="seek">
      <span id="cur">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek" disabled>
      <span id="dur">0:00</span>
    </div>
    <div class="ctrl">
      <button class="ib" id="shuffle" aria-label="Shuffle" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M17 3h4v4l-1.5-1.5-4.6 4.6-1.4-1.4 4.6-4.6L17 3zM3 7h3.6c1 0 1.9.5 2.5 1.3l6.6 8.7c.2.3.6.5 1 .5H17l-1.5-1.5 1.4-1.4L21 17l-4.1 4.1-1.4-1.4L17 18.2h-1.3c-1 0-1.9-.5-2.5-1.3L6.6 8.2c-.2-.3-.6-.5-1-.5H3V7zm0 10h2.6c.4 0 .8-.2 1-.5l1.2-1.6 1.2 1.6-.5.7c-.6.8-1.5 1.3-2.5 1.3H3v-1.5z"/></svg></button>
      <button class="ib" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg></button>
      <button class="ib play" id="play" aria-label="Play"><svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="ib" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5l10.5 7L4 19z"/></svg></button>
      <button class="ib" id="repeat" aria-label="Repeat: off"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
    </div>
    <div class="vol">
      <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
      <input type="range" id="vol" min="0" max="100" value="100" aria-label="Volume">
    </div>
  </section>

  <section>
    <div class="listhead">
      <input type="search" id="q" placeholder="Search tracks" aria-label="Search tracks">
      <span class="count" id="count">0 tracks</span>
    </div>
  </section>
  <ul class="list" id="list"><li class="empty">Your library is empty. Choose files or a folder to add tracks.</li></ul>
  <audio id="audio" preload="metadata"></audio>
</main>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var audio=$('audio'),list=$('list'),tracks=[],order=[],idx=-1,shuffle=false,repeat=0,q='';
  var EXT=/\.(mp3|m4a|aac|wav|flac|ogg|oga|opus|weba|webm)$/i;

  function fmt(s){if(!isFinite(s))return '0:00';s=Math.floor(s);var m=Math.floor(s/60),r=s%60;return m+':'+(r<10?'0':'')+r}
  function clean(n){return n.replace(/\.[^.]+$/,'').replace(/[_]+/g,' ').trim()}

  function add(fileList){
    var skipped=0,added=0,have={};
    tracks.forEach(function(t){have[t.file.name+t.file.size]=1});
    Array.prototype.forEach.call(fileList,function(f){
      var ok=(f.type&&f.type.indexOf('audio/')===0)||EXT.test(f.name);
      if(!ok){skipped++;return}
      if(have[f.name+f.size])return;
      have[f.name+f.size]=1;
      var t={file:f,name:clean(f.name),folder:(f.webkitRelativePath||'').split('/').slice(-2,-1)[0]||'',url:URL.createObjectURL(f),dur:null};
      tracks.push(t);added++;
      probe(t);
    });
    var n=$('note');
    if(skipped){n.hidden=false;n.textContent=skipped+' non-audio file'+(skipped>1?'s':'')+' skipped.'}else n.hidden=true;
    buildOrder();render();
    if(idx<0&&tracks.length)load(0,false);
  }
  function probe(t){
    var a=new Audio();a.preload='metadata';
    a.onloadedmetadata=function(){t.dur=a.duration;a.src='';render()};
    a.onerror=function(){t.dur=NaN};
    a.src=t.url;
  }
  function buildOrder(){
    var cur=idx>=0?order[idx]:-1;
    order=tracks.map(function(_,i){return i});
    if(shuffle){for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=order[i];order[i]=order[j];order[j]=x}
      if(cur>=0){var p=order.indexOf(cur);order.splice(p,1);order.unshift(cur)}}
    idx=cur>=0?order.indexOf(cur):idx;
  }
  function render(){
    var cur=idx>=0?order[idx]:-1,rows=[],ql=q.toLowerCase();
    tracks.forEach(function(t,i){
      if(ql&&(t.name+' '+t.folder).toLowerCase().indexOf(ql)<0)return;
      rows.push('<li class="track" tabindex="0" data-i="'+i+'"'+(i===cur?' aria-current="true"':'')+'><span class="tn"></span><span class="td">'+(t.dur?fmt(t.dur):'')+'</span></li>');
    });
    list.innerHTML=rows.length?rows.join(''):'<li class="empty">'+(tracks.length?'No tracks match your search.':'Your library is empty. Choose files or a folder to add tracks.')+'</li>';
    var els=list.querySelectorAll('.track');
    Array.prototype.forEach.call(els,function(el){el.querySelector('.tn').textContent=tracks[+el.dataset.i].name});
    $('count').textContent=tracks.length+' track'+(tracks.length===1?'':'s');
  }
  function load(p,play){
    if(p<0||p>=order.length)return;
    idx=p;var t=tracks[order[p]];
    audio.src=t.url;
    $('title').textContent=t.name;
    $('meta').textContent=(t.folder?t.folder+' · ':'')+(p+1)+' of '+order.length;
    $('seek').disabled=false;
    if('mediaSession' in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:t.name,artist:t.folder||'Local file'})}catch(e){}}
    render();
    if(play){var pr=audio.play();if(pr&&pr.catch)pr.catch(function(){})}
    var el=list.querySelector('[aria-current="true"]');if(el&&el.scrollIntoView)el.scrollIntoView({block:'nearest'});
  }
  function step(d,auto){
    if(!order.length)return;
    var n=idx+d;
    if(n>=order.length){if(repeat===1||(!auto)){n=0}else{audio.pause();return}}
    if(n<0)n=order.length-1;
    load(n,true);
  }

  audio.addEventListener('play',function(){setIcon(true)});
  audio.addEventListener('pause',function(){setIcon(false)});
  audio.addEventListener('timeupdate',function(){
    $('cur').textContent=fmt(audio.currentTime);
    if(audio.duration&&!seeking)$('seek').value=Math.round(audio.currentTime/audio.duration*1000);
  });
  audio.addEventListener('loadedmetadata',function(){$('dur').textContent=fmt(audio.duration)});
  audio.addEventListener('ended',function(){if(repeat===2){audio.currentTime=0;audio.play()}else step(1,true)});
  audio.addEventListener('error',function(){$('meta').textContent='This file could not be played on this device.'});

  function setIcon(p){
    $('playIcon').innerHTML=p?'<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>':'<path d="M8 5v14l11-7z"/>';
    $('play').setAttribute('aria-label',p?'Pause':'Play');
  }
  function toggle(){
    if(idx<0)return;
    if(audio.paused){var pr=audio.play();if(pr&&pr.catch)pr.catch(function(){})}else audio.pause();
  }
  var seeking=false;
  $('seek').addEventListener('input',function(){seeking=true;if(audio.duration)$('cur').textContent=fmt(this.value/1000*audio.duration)});
  $('seek').addEventListener('change',function(){if(audio.duration)audio.currentTime=this.value/1000*audio.duration;seeking=false});
  $('vol').addEventListener('input',function(){audio.volume=this.value/100});
  $('play').onclick=toggle;
  $('next').onclick=function(){step(1,false)};
  $('prev').onclick=function(){if(audio.currentTime>3){audio.currentTime=0}else step(-1,false)};
  $('shuffle').onclick=function(){shuffle=!shuffle;this.classList.toggle('on',shuffle);this.setAttribute('aria-pressed',shuffle);buildOrder();render()};
  $('repeat').onclick=function(){
    repeat=(repeat+1)%3;
    this.classList.toggle('on',repeat>0);
    this.setAttribute('aria-label','Repeat: '+['off','all','one'][repeat]);
    this.style.opacity=repeat===2?'1':'';
    this.title=['Repeat off','Repeat all','Repeat one'][repeat];
  };
  $('q').addEventListener('input',function(){q=this.value;render()});
  list.addEventListener('click',function(e){
    var el=e.target.closest('.track');if(!el)return;
    var ti=+el.dataset.i;load(order.indexOf(ti),true);
  });
  list.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&e.target.classList.contains('track')){load(order.indexOf(+e.target.dataset.i),true)}
  });

  $('pickFiles').onclick=function(){$('files').click()};
  $('pickFolder').onclick=function(){$('folder').click()};
  $('files').onchange=function(){add(this.files);this.value=''};
  $('folder').onchange=function(){add(this.files);this.value=''};

  var drop=$('drop');
  ['dragenter','dragover'].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.add('over')})});
  ['dragleave','drop'].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.remove('over')})});
  drop.addEventListener('drop',function(e){
    var items=e.dataTransfer&&e.dataTransfer.items,files=[],pending=0;
    function done(){if(!pending)add(files)}
    function walk(entry){
      if(entry.isFile){pending++;entry.file(function(f){files.push(f);pending--;done()},function(){pending--;done()})}
      else if(entry.isDirectory){pending++;var r=entry.createReader();
        (function read(){r.readEntries(function(es){if(es.length){es.forEach(walk);read()}else{pending--;done()}},function(){pending--;done()})})()}
    }
    if(items&&items.length&&items[0].webkitGetAsEntry){pending++;Array.prototype.forEach.call(items,function(it){var en=it.webkitGetAsEntry();if(en)walk(en)});pending--;done()}
    else add(e.dataTransfer.files);
  });
  window.addEventListener('dragover',function(e){e.preventDefault()});
  window.addEventListener('drop',function(e){e.preventDefault()});

  document.addEventListener('keydown',function(e){
    var tag=(e.target.tagName||'').toLowerCase();
    if(tag==='input'||tag==='button'||e.target.classList.contains('track'))return;
    if(e.code==='Space'){e.preventDefault();toggle()}
    else if(e.key==='ArrowRight')step(1,false);
    else if(e.key==='ArrowLeft')step(-1,false);
  });

  if('mediaSession' in navigator){
    try{
      navigator.mediaSession.setActionHandler('play',toggle);
      navigator.mediaSession.setActionHandler('pause',toggle);
      navigator.mediaSession.setActionHandler('nexttrack',function(){step(1,false)});
      navigator.mediaSession.setActionHandler('previoustrack',function(){step(-1,false)});
    }catch(e){}
  }

  var NATIVE=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
  if(NATIVE){
    var MS=Capacitor.registerPlugin('MusicScanner');
    drop.innerHTML='<p id="scanmsg">Looking for music on this device\u2026</p><div class="row"><button class="btn" id="rescan">Rescan device</button></div>';
    var apply=function(items){
      var cp=idx>=0&&tracks[order[idx]]?tracks[order[idx]].path:null;
      tracks=items.map(function(m){return {file:null,name:m.title||'Untitled',folder:m.artist||'',path:m.path,url:Capacitor.convertFileSrc('file://'+m.path),dur:m.duration/1000}});
      idx=-1;order=[];
      if(cp){var ni=tracks.findIndex(function(t){return t.path===cp});if(ni>=0){order=tracks.map(function(_,i){return i});idx=ni}}
      buildOrder();render();
      if(idx<0&&tracks.length)load(0,false);
    };
    var scan=function(){
      var msg=$('scanmsg');
      return MS.scan().then(function(r){
        var items=r.tracks||[];
        try{localStorage.setItem('lib',JSON.stringify(items))}catch(e){}
        apply(items);
        msg.textContent=items.length?items.length+' tracks found on this device.':'No music found on this device.';
      }).catch(function(){msg.textContent='Allow audio access in Settings > Apps to find your music.'});
    };
    try{var cached=JSON.parse(localStorage.getItem('lib')||'[]');if(cached.length)apply(cached)}catch(e){}
    $('rescan').onclick=scan;
    scan();
  }
})();
</script>
</body>
</html>
